[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-mcp-extractor"
version = "0.3.0"
description = "Read-only MCP server for extracting Rockwell Arena models"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-4.0"
dependencies = [
    "mcp==1.28.1",
    "olefile==0.47",
    "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["jsonschema>=4.18"]

[project.scripts]
arena-mcp = "arena_mcp.cli:main"

[tool.setuptools]
py-modules = ["arena_api"]
packages = ["arena_mcp"]

[tool.setuptools.package-data]
arena_mcp = ["schemas/*.json", "examples/*.json"]
